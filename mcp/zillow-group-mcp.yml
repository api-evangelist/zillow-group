description: >-
  MCP posture for Zillow Group. Zillow Group ships NO Model Context Protocol server for any
  of the seventeen APIs on its developer portal — there is no hosted endpoint an agent can
  POST to, and no stdio package that wraps Zillow data. The one MCP artifact the company
  ever published, AutoMobile, is an internal mobile-test-automation tool: it drives Android
  devices, not Zillow's real-estate, mortgage, rentals or transaction APIs, and Zillow has
  since archived it. No `MCPServer` pointer is emitted in apis.yml, because that pointer
  asserts an agent surface onto the provider's API — and none exists.
