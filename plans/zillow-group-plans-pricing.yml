specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Zillow Group
providerId: zillow-group
created: '2026-05-04'
generated: '2026-08-28'
modified: '2026-08-28'
method: searched
source: https://www.zillowgroup.com/developers/
# 2026-08-28: this file previously carried a bulk-sweep SCAFFOLD with invented Free /
# Professional / Enterprise tiers and quota numbers. Zillow Group has never published any of
# them. The scaffold has been removed and replaced with the measured result.
tags:
  - Real Estate
  - Pricing
description: >-
  Published API plans and pricing for Zillow Group. There are none. Every API on the Zillow
  Group developer portal is gated by a "Request Access" form or an invite-only data agreement,
  and no price, tier, quota or free allowance is published for any of them. This is a
  contact-sales surface end to end.
plan_count: 0
plans: []
access_model:
  self_serve: false
  free_tier_published: false
  pricing_published: false
  gate: request-access form or invite-only data agreement on every API
  agreement_types_named:
    - Partner/MSA (Mortech mortgage APIs)
    - Terms of Use, Branding Requirements (Zillow Agent Reviews)
    - dotloop Connect (Transaction Management)
    - Zillow Data Terms of Use (Zillow Group Datasets on Bridge)
  note: >-
    The MLS Listings API is explicitly invitation-only: access is granted through Zillow Group's
    MLS partners in the US and Canada at their discretion.
free_data_surfaces:
  - name: Zillow Research data
    url: https://www.zillow.com/research/data/
    price: free
    delivery: CSV download
    note: >-
      The Real Estate Metrics and Neighborhood Data entries on the developer portal are not
      keyed APIs — they resolve to a free CSV download portal, "free for public use by
      consumers, media, analysts, academics and policymakers".
evidence:
  - url: https://www.zillowgroup.com/developers/
    status: 200
  - url: https://www.zillowgroup.com/developers/api/mls-broker-data/mls-listings/
    status: 200
    note: Invitation-only; no pricing.
  - url: https://www.zillowgroup.com/developers/api/mortgage/prospect-sync-api/
    status: 200
    note: 'Agreement type: Partner/MSA; no pricing.'
