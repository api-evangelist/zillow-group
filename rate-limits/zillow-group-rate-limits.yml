specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Zillow Group
providerId: zillow-group
created: '2026-05-04'
generated: '2026-08-28'
modified: '2026-08-28'
method: searched
source: https://www.zillowgroup.com/developers/
# 2026-08-28: this file previously carried a bulk-sweep SCAFFOLD (free 10/min, pro 100/min,
# enterprise 1000/min) that Zillow Group has never published. Those numbers were fabricated
# and have been removed. Every one of the seventeen API pages on
# https://www.zillowgroup.com/developers/ was read on 2026-08-28; not one states a quota, a
# window, a burst ceiling, a 429 behaviour or a rate-limit response header.
tags:
  - Real Estate
  - Rate Limiting
description: >-
  Published rate limits for the Zillow Group API surface. There are none. Zillow Group
  documents no quota, no window, no burst, no exhaustion status code and no rate-limit
  response headers on any of the seventeen APIs listed on its developer portal — which means
  a client cannot size an integration, and an agent has no runtime signal to back off on.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
policies: []
evidence:
  - url: https://www.zillowgroup.com/developers/
    status: 200
    note: Portal index — seven programs, seventeen APIs, no rate-limit section.
  - url: https://www.zillowgroup.com/developers/api/zestimate/zestimates-api/
    status: 200
    note: Fact panel gives auth, style and formats only; no limits.
  - url: https://www.zillowgroup.com/developers/api/mortgage/rate-cloud-api/
    status: 200
    note: >-
      States capacity as marketing prose — "respond to millions of quotes per hour" — with no
      per-client limit, window or header. Deliberately not recorded as a limit.
  - url: https://www.zillowgroup.com/developers/api/rentals/lead-api/
    status: 200
    note: Webhook delivery API; no limits and no retry policy stated.
subsidiary_limits_note: >-
  The only published rate limit reachable from this portal belongs to a subsidiary: the dotloop
  Public API v2 documents 100 requests per minute per client application per user, a 429 on
  exhaustion, and X-RateLimit-Limit / X-RateLimit-Remaining / X-RateLimit-Reset response
  headers. That is dotloop's contract, recorded in all/dotloop, and is deliberately NOT counted
  as a Zillow Group limit here.
