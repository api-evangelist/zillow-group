description: >-
  Lifecycle posture for the Zillow Group API surface: versioning, deprecation, status
  reporting and SLA. The dominant lifecycle fact about this provider is a retirement, not a
  release — the public Zillow Web Services API (Zestimate, GetSearchResults, GetDeepSearchResults)
  is gone from the developer portal, and everything that replaced it is invite-only.
versioning:
  scheme: per-platform, not per-company
  documented: false
  note: >-
    Zillow Group publishes no versioning policy of its own. Of the four platforms behind the
    portal, only the dotloop-served Transaction Management API carries a version in its path
    (/public/v2); the Bridge-served APIs version by dataset, and the Mortech mortgage APIs
    publish no version at all.
  evidence: https://www.zillowgroup.com/developers/
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation policy, notice window, Sunset/Deprecation header support or migration guide
    is published anywhere on https://www.zillowgroup.com/developers/. No `Deprecation` pointer
    is emitted.
retirements:
  - name: Zillow Web Services API
    surface: Zestimate, GetSearchResults, GetDeepSearchResults, GetUpdatedPropertyDetails
    retired: '2021-09-30'
    status: retired
    confidence: medium
    evidence: >-
      Verified by absence: the Zillow Group developer portal fetched 2026-08-28 lists seven
      programs and seventeen APIs, and the public Web Services API appears in none of them.
      Zestimate access is now routed through the Bridge platform under an invite-only Zillow
      Group Datasets agreement. The retirement date is from third-party reporting rather than a
      first-party Zillow notice, because the original announcement page is no longer served.
    consequence: >-
      This is the single most consequential lifecycle event in the repo. A once-open,
      self-serve public API became a request-access enterprise data agreement, and every
      third-party "Zillow API" now on the market is an unaffiliated scraper or wrapper.
