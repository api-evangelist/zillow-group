description: >-
  First-party published packages from Zillow Group. THE HEADLINE FINDING IS A NEGATIVE:
  Zillow Group publishes NO client SDK for any of the seventeen APIs listed on its own
  developer portal. Every API on https://www.zillowgroup.com/developers/ is documented in
  prose with a "Request Access" form and no accompanying client library in any registry.
  The packages below are real, first-party, and published under the github.com/zillow org,
  but they are general-purpose open source (ML, Kafka, Go/React utilities) — none of them
  wraps a Zillow Group API. No `SDKs` pointer is emitted for that reason; emitting one
  would credit Zillow Group with an integration ergonomic it does not ship.
